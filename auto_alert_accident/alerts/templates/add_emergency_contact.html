{% extends 'auth_base_v2.html' %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="height:70vh;">
  <div style="width:480px;">
    <h3>Add Emergency Contact</h3>
    <p class="text-muted">Who should we call if you're in danger? This will be used only for emergency alerts.</p>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input name="name" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Phone (include country code)</label>
        <input name="phone" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Email (optional)</label>
        <input name="email" class="form-control" />
      </div>

      <button class="btn btn-primary">Save Contact</button>
    </form>
  </div>
</div>

{% endblock %}
