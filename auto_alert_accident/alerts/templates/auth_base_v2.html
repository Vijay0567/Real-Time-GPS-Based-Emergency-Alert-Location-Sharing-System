<!DOCTYPE html>
<html>
<head>

<title>Auto Alert System</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<style>
body{
height:100vh;
margin:0;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-image: 
url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80'),
linear-gradient(135deg, rgba(15,32,39,0.9) 0%, rgba(44,83,100,0.9) 100%);
background-size: cover, cover;
background-position: center, center;
background-repeat: no-repeat;
display:flex;
justify-content:center;
align-items:center;
position: relative;
}

body::before {
content: '';
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: 
radial-gradient(circle at 20% 80%, rgba(120,119,198,0.3) 0%, transparent 50%),
radial-gradient(circle at 80% 20%, rgba(255,119,198,0.3) 0%, transparent 50%),
radial-gradient(circle at 40% 40%, rgba(120,219,255,0.4) 0%, transparent 50%);
animation: aurora 8s ease-in-out infinite alternate;
pointer-events: none;
z-index: 1;
}

@keyframes aurora {
0% { opacity: 0.6; transform: scale(1); }
100% { opacity: 1; transform: scale(1.1); }
}

.auth-container{
max-width: 450px;
width: 90%;
background: rgba(255, 255, 255, 0.1);
backdrop-filter: blur(20px);
border-radius: 24px;
padding: 50px 40px;
box-shadow: 
0 25px 50px rgba(0,0,0,0.4),
inset 0 1px 0 rgba(255,255,255,0.2);
position: relative;
z-index: 10;
border: 1px solid rgba(255,255,255,0.2);
animation: slideInUp 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

@keyframes slideInUp {
0% {
opacity: 0;
transform: translateY(50px) scale(0.9);
}
100% {
opacity: 1;
transform: translateY(0) scale(1);
}
}

.logo {
text-align: center;
margin-bottom: 20px;
}

.logo i {
font-size: 4rem;
background: linear-gradient(45deg, #00d4ff, #ff6b6b, #4ecdc4);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
animation: logoRotate 3s linear infinite;
filter: drop-shadow(0 0 20px rgba(0,212,255,0.5));
}

@keyframes logoRotate {
0% { transform: rotateY(0deg); }
100% { transform: rotateY(360deg); }
}

.auth-title{
text-align: center;
color: white;
font-size: 2rem;
font-weight: 700;
margin-bottom: 10px;
text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

.auth-subtitle {
text-align: center;
color: rgba(255,255,255,0.8);
margin-bottom: 30px;
font-size: 1.1rem;
}

.form-control{
background: rgba(255,255,255,0.9);
backdrop-filter: blur(10px);
border: none;
border-radius: 16px;
padding: 16px 20px;
font-size: 1rem;
transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
box-shadow: 0 4px 20px rgba(0,0,0,0.1);
margin-bottom: 20px;
}

.form-control:focus {
transform: translateY(-3px) scale(1.02);
box-shadow: 
0 12px 40px rgba(0,212,255,0.4),
0 0 0 4px rgba(0,212,255,0.2);
color: #333;
}

.form-control::placeholder {
color: #888;
}

.auth-btn {
background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
border: none;
border-radius: 16px;
padding: 16px;
font-weight: 700;
font-size: 1.1rem;
color: white;
transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
box-shadow: 0 8px 30px rgba(255,107,107,0.4);
position: relative;
overflow: hidden;
text-transform: uppercase;
letter-spacing: 1px;
}

.auth-btn:hover {
transform: translateY(-5px) scale(1.05);
box-shadow: 0 20px 50px rgba(255,107,107,0.6);
}

.auth-btn:active {
transform: translateY(-2px) scale(1.02);
}

.auth-btn::before {
content: '';
position: absolute;
top: 0;
left: -100%;
width: 100%;
height: 100%;
background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
transition: left 0.6s;
}

.auth-btn:hover::before {
left: 100%;
}

.register-link, .register-link a {
color: rgba(255,255,255,0.9);
text-decoration: none;
transition: color 0.3s ease;
}

.register-link a:hover {
color: #4ecdc4;
text-shadow: 0 0 10px rgba(78,205,196,0.5);
}

.alert {
background: rgba(255,0,0,0.2);
backdrop-filter: blur(10px);
border: 1px solid rgba(255,0,0,0.3);
color: white;
border-radius: 12px;
}

@media (max-width: 576px) {
.auth-container {
padding: 40px 25px;
}
.logo i {
font-size: 3rem;
}
.auth-title {
font-size: 1.7rem;
}
}

</style>

</head>

<body>

<div class="auth-container">

{% block content %}
{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Smooth input animations
document.querySelectorAll('.form-control').forEach((input, index) => {
let isAnimating = false;
input.addEventListener('focus', () => {
if (!isAnimating) {
input.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
}
});
input.addEventListener('blur', () => {
input.style.transition = 'all 0.3s ease';
});
});

// Floating animation for container on load
window.addEventListener('load', () => {
const container = document.querySelector('.auth-container');
container.style.animation = 'none';
setTimeout(() => {
container.style.animation = 'slideInUp 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
}, 100);
});

// Button click ripple effect
document.querySelectorAll('.auth-btn').forEach(btn => {
btn.addEventListener('click', function(e) {
const ripple = document.createElement('span');
ripple.classList.add('ripple');
const rect = this.getBoundingClientRect();
const size = Math.max(rect.width, rect.height);
const x = e.clientX - rect.left - size / 2;
const y = e.clientY - rect.top - size / 2;
ripple.style.width = ripple.style.height = size + 'px';
ripple.style.left = x + 'px';
ripple.style.top = y + 'px';
this.appendChild(ripple);
setTimeout(() => ripple.remove(), 600);
});
});

</script>

</body>
</html>
