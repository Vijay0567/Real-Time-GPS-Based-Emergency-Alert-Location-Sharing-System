{% extends 'auth_base_v2.html' %}

{% block content %}

<div class="logo">
<i class="fa-solid fa-user-plus"></i>
</div>

<h3 class="auth-title">Create Account</h3>
<p class="auth-subtitle">Join Auto Alert System for emergency safety</p>

<!-- Error Messages -->
{% if messages %}
{% for message in messages %}
<div class="alert alert-danger text-center mb-4">
{{ message }}
</div>
{% endfor %}
{% endif %}

<form method="POST">
{% csrf_token %}

<div class="mb-3">
<input type="text" name="name" placeholder="Full Name *" class="form-control" required>
</div>

<div class="mb-3">
<input type="number" name="age" placeholder="Age *" min="1" max="120" class="form-control" required>
</div>

<div class="mb-3">
<select name="sex" class="form-control" required>
<option value="">Select Gender *</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
<option value="Other">Other</option>
</select>
</div>

<div class="mb-3">
<input type="tel" name="phone" placeholder="Phone Number *" class="form-control" required>
</div>

<div class="mb-3">
<input type="email" name="email" placeholder="Email Address *" class="form-control" required>
</div>

<div class="mb-3">
<select name="blood" class="form-control" required>
<option value="">Blood Group *</option>
<option>A+</option><option>A-</option><option>B+</option><option>B-</option>
<option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
</select>
</div>

<div class="mb-3">
<input type="text" name="username" placeholder="Username *" class="form-control" required>
</div>

<div class="mb-3">
<input type="password" name="password" placeholder="Password *" class="form-control" required minlength="6">
</div>

<button type="submit" class="auth-btn w-100 mb-4">
<i class="fa fa-user-plus me-2"></i>Create Account
</button>

</form>

<div class="register-link text-center">
Already have an account? <a href="/login/">Login</a>
</div>

{% endblock %}
