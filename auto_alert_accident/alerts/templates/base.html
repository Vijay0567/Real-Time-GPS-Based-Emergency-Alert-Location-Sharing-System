<!DOCTYPE html>
<html>
<head>

<title>Auto Alert Accident System</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
	:root{
		--bg: #ffffff;
		--text: #222222;
		--muted: #6c757d;
		--nav-bg: #343a40;
		--sidebar-bg: #212529;
		--sidebar-link: #ffffff;
		--map-bg: #f8f9fa;
	}

	.dark-mode{
		--bg: #0a192f;
		--text: #e6eef3;
		--muted: #9fb1c1;
		--nav-bg: #071126;
		--sidebar-bg: #0f1724;
		--sidebar-link: #e6eef3;
		--map-bg: #071226;
	}

	html,body{height:100%;}
	body{
		background:var(--bg);
		color:var(--text);
		font-family:Segoe UI, system-ui, -apple-system, 'Helvetica Neue', Arial;
	}

	.navbar{background:var(--nav-bg) !important}
	.navbar-brand{color:var(--sidebar-link)}

	.sidebar{
		height:100vh;
		background:var(--sidebar-bg);
		color:var(--sidebar-link);
		padding-top:20px;
	}

	.sidebar a{
		display:block;
		padding:12px;
		color:var(--sidebar-link);
		text-decoration:none;
	}

	.sidebar a:hover{background:rgba(255,255,255,0.03)}

	#map{height:500px;background:var(--map-bg)}

	/* small theme toggle styling */
	#themeToggle{border-radius:8px}

</style>

</head>

<body>

<nav class="navbar navbar-dark px-3">
	<span class="navbar-brand">🚨 Auto Alert System</span>
	<div style="margin-left:auto">
		<button id="themeToggle" class="btn btn-sm btn-outline-light">Toggle Theme</button>
	</div>
</nav>

<div class="container-fluid">
<div class="row">

<div class="col-md-2 sidebar">

<a href="/">Dashboard</a>
<a href="/alert/">Emergency Alert</a>
<a href="/contacts/">Contacts</a>
<a href="/history/">Alert History</a>
<a href="/map/">Map Dashboard</a>

</div>

<div class="col-md-10 p-4">

{% block content %}
{% endblock %}

</div>

</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
	// Theme toggle: persist in localStorage and apply `dark-mode` class to <html>
	(function(){
		const key = 'site-theme';
		const btn = document.getElementById('themeToggle');
		function apply(theme){
			if(theme === 'dark') document.documentElement.classList.add('dark-mode');
			else document.documentElement.classList.remove('dark-mode');
			if(btn) btn.textContent = theme === 'dark' ? 'Light' : 'Dark';
		}
		const saved = localStorage.getItem(key) || 'light';
		apply(saved);
		if(btn){
			btn.addEventListener('click', function(){
				const cur = document.documentElement.classList.contains('dark-mode') ? 'dark' : 'light';
				const next = cur === 'dark' ? 'light' : 'dark';
				localStorage.setItem(key, next);
				apply(next);
			});
		}
	})();
</script>

</body>
</html>
